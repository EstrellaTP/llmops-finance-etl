name: Retrain Sectorial Models

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1,15 * *'

jobs:
  run-retraining:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t finance-etl .

      - name: Create GCP Credentials File
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > gcp-key.json

      - name: Run Docker Container (Training Mode)
        run: |
          docker run \
            -e GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json \
            -e PYTHONPATH=/app \
            -v ${{ github.workspace }}/gcp-key.json:/app/gcp-key.json \
            finance-etl \
            python -m src.models.train